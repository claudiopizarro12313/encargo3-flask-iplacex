{% extends "base.html" %}

{% block title %}Ejercicio 1 - Formulario de Notas{% endblock %}

{% block content %}
<div class="tarjeta-formulario">
    <h1>Formulario de Notas</h1>
    <form method="POST" action="{{ url_for('ejercicio1') }}">
        <div class="campo">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1" min="10" max="70" step="0.1" value="{{ nota1 }}" required>
        </div>

        <div class="campo">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2" min="10" max="70" step="0.1" value="{{ nota2 }}" required>
        </div>

        <div class="campo">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3" min="10" max="70" step="0.1" value="{{ nota3 }}" required>
        </div>

        <div class="campo">
            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="1" value="{{ asistencia }}" required>
        </div>

        <button type="submit" class="btn-enviar">Enviar</button>
    </form>

    {% if promedio is not none and estado is not none %}
    <div class="resultado-izquierda">
        <p>{{ promedio }}</p>
        <p>{{ estado }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
