{% extends "base.html" %}

{% block title %}Ejercicio 2 - Comparador de Nombres{% endblock %}

{% block content %}
<div class="tarjeta-formulario tarjeta-centrada">
    <form method="POST" action="{{ url_for('ejercicio2') }}">
        <div class="campo campo-centrado">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1" value="{{ nombre1 }}" required>
        </div>

        <div class="campo campo-centrado">
            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2" value="{{ nombre2 }}" required>
        </div>

        <div class="campo campo-centrado">
            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3" value="{{ nombre3 }}" required>
        </div>

        <div class="boton-centrado">
            <button type="submit" class="btn-enviar">Enviar</button>
        </div>
    </form>

    {% if nombre_mayor is not none %}
    <div class="resultado-centrado">
        <p>El nombre con mayor cantidad de caracteres es : {{ nombre_mayor }}</p>
        <p>El nombre tiene : {{ cantidad_caracteres }} caracteres</p>
    </div>
    {% endif %}
</div>
{% endblock %}
